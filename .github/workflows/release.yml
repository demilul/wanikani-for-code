name: Publish Extension

# On a version tag (e.g. v0.2.0): build, package, publish to the VS Marketplace
# (tokenless via GitHub OIDC -> Entra federation), and create a GitHub Release
# with the VSIX attached.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # request the GitHub OIDC token for Azure federation
  contents: write # create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    # The federated credential is scoped to this environment.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate the release on a green build + tests.
      - run: npm run compile
      - run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Marketplace
        run: npx --yes @vscode/vsce publish --packagePath *.vsix --azure-credential

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.vsix"
