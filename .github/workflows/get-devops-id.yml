name: Get Azure DevOps Profile ID (one-time helper)

# One-time helper: authenticates AS the managed identity via OIDC, materializes
# its Azure DevOps profile, and prints the profile "id" — the ONLY id the
# Marketplace "Members" field accepts. Run once, copy the id, then delete this file.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-id:
    runs-on: ubuntu-latest
    # Must match the federated credential subject (environment:release).
    environment: release
    steps:
      - name: Azure login (OIDC) as the managed identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Materialize profile and print the Marketplace member id
        run: |
          echo "Copy the \"id\" value below into Marketplace → Members → Add (role: Contributor):"
          az rest \
            --method get \
            --uri 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1' \
            --resource 499b84ac-1321-427f-aa17-267ca6975798
